<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inboedel opruimen en opkopen in Antwerpen | GuySa</title>
    <meta name="description" content="GuySa ruimt inboedels op, koopt ze aan en levert het pand borstelschoon op in Antwerpen, Lier, Mortsel en Boechout. Gratis offerte aan huis." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#111010" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/logo.png" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- De twee letters staan onder een vaste naam in /fonts (zie
         scripts/fonts.mjs), zodat ze hier bij naam genoemd kunnen worden. Een
         bestand met een hash in zijn naam kun je niet vooraf aankondigen, en
         dan ontdekt de browser ze pas nadat hij het stijlblad heeft gelezen. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-wght.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin-wght.woff2" crossorigin />
    <!-- Het grootste beeld van de eerste weergave. -->
    <link rel="preload" as="image" href="/img/hero.webp" fetchpriority="high" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GuySa Inboedels &amp; Opruimingen" />
    <meta property="og:title" content="GuySa Inboedels &amp; Opruimingen | Regio Antwerpen" />
    <meta property="og:description" content="Wij ruimen inboedels op, kopen ze aan en leveren het pand borstelschoon op. Gratis offerte, antwoord binnen 24 uur." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/img/og-home.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GuySa Inboedels &amp; Opruimingen, regio Antwerpen" />
    <meta property="og:locale" content="nl_BE" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- De zaak, zoals een zoekmachine hem leest. Het telefoonnummer, het
         mailadres en het werkgebied komen uit site.config.mjs; verandert daar
         iets, dan hoort het hier mee. scripts/audit-seo.mjs rekent dat na. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MovingCompany",
      "@id": "%SITE_URL%/#bedrijf",
      "name": "GuySa Inboedels & Opruimingen",
      "description": "Opruiming, ontruiming en opkoop van inboedels in de regio Antwerpen, inclusief schoonmaak en gesorteerde afvoer.",
      "url": "%SITE_URL%/",
      "image": "%SITE_URL%/img/og-home.webp",
      "logo": "%SITE_URL%/img/logo.png",
      "telephone": "+32472688835",
      "email": "info@guysa-inboedels.be",
      "priceRange": "€€",
      "sameAs": ["https://guysa-inboedels.be"],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Antwerpen",
        "addressRegion": "Antwerpen",
        "addressCountry": "BE"
      },
      "serviceArea": {
        "@type": "GeoCircle",
        "geoMidpoint": { "@type": "GeoCoordinates", "latitude": 51.17, "longitude": 4.47 },
        "geoRadius": 25000
      },
      "areaServed": [
        { "@type": "City", "name": "Antwerpen" },
        { "@type": "City", "name": "Deurne" },
        { "@type": "City", "name": "Berchem" },
        { "@type": "City", "name": "Borsbeek" },
        { "@type": "City", "name": "Wommelgem" },
        { "@type": "City", "name": "Wilrijk" },
        { "@type": "City", "name": "Mortsel" },
        { "@type": "City", "name": "Edegem" },
        { "@type": "City", "name": "Hove" },
        { "@type": "City", "name": "Boechout" },
        { "@type": "City", "name": "Vremde" },
        { "@type": "City", "name": "Kontich" },
        { "@type": "City", "name": "Lint" },
        { "@type": "City", "name": "Ranst" },
        { "@type": "City", "name": "Lier" }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Diensten",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Opruiming en ontruiming van woningen, kelders en kantoren" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Opkoop van volledige of gedeeltelijke inboedels" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Schoonmaak en borstelschoon opleveren" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Sortering, afvoer en hergebruik" } }
        ]
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "%SITE_URL%/#website",
      "url": "%SITE_URL%/",
      "name": "GuySa Inboedels & Opruimingen",
      "inLanguage": "nl-BE",
      "publisher": { "@id": "%SITE_URL%/#bedrijf" }
    }
    </script>

    <!-- Dezelfde vragen en antwoorden als in VRAGEN in src/App.tsx, woordelijk.
         Google toont dit sinds 2026 niet meer als rich result, maar het is wel
         wat een taalmodel leest als iemand vraagt wat borstelschoon betekent. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "%SITE_URL%/#vragen",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Hoe verloopt het opruimen van een inboedel?",
          "acceptedAnswer": { "@type": "Answer", "text": "Hiervoor komen wij vrijblijvend langs om een offerte te maken. Die offerte wordt gemaakt op basis van de grootte en de samenstelling van de inboedel. Na akkoord gaan wij over tot een vlotte afhandeling." }
        },
        {
          "@type": "Question",
          "name": "Wat kost een taxatie of een offerte?",
          "acceptedAnswer": { "@type": "Answer", "text": "Niets. Enkel wanneer u een gedetailleerde taxatie wenst, met de waarde van elk item op een inventaris, kan daarvoor een tarief aangerekend worden. Dat hangt af van de grootte van de inboedel." }
        },
        {
          "@type": "Question",
          "name": "Kan ik ook losse items verkopen?",
          "acceptedAnswer": { "@type": "Answer", "text": "Ja, bij GuySa Inboedels kunt u ook losse items verkopen, voornamelijk stukken die enige waarde hebben. Neem gerust contact op voor meer uitleg." }
        },
        {
          "@type": "Question",
          "name": "Wat is borstelschoon?",
          "acceptedAnswer": { "@type": "Answer", "text": "Mogelijk moet het pand na het verwerken van de inboedel nog verkocht of opnieuw bewoond worden. Wij kunnen ervoor zorgen dat alles grondig gekuist wordt voor de instap. Ook schilderwerken zijn mogelijk. Hier vallen niet onder: kleine herstellingen aan elektriciteit of loodgieterij, het uitbreken van muren of vloeren en bezetwerk. Daarvoor kan wel samen naar een oplossing gezocht worden." }
        },
        {
          "@type": "Question",
          "name": "Hoe verloopt de betaling?",
          "acceptedAnswer": { "@type": "Answer", "text": "Wordt de inboedel opgekocht, dan bezorgen wij u een verkoopbewijs en storten wij het bedrag op rekening, of betalen we op de manier die u verkiest: Payconiq, contant bij kleinere bedragen, of via de bankapp. Gaat het om een opruiming of een andere dienst, dan maken wij een factuur op." }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
