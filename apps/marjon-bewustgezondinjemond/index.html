<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b4249" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- De lettertypes staan op onze eigen server (zie de @font-face-regels in
         index.css). Er gaat dus geen verzoek meer naar fonts.googleapis.com, en
         daarmee geen ip-adres van een bezoeker naar Google. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/quicksand-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="/img/bloem.png" fetchpriority="high" />
    <!-- media/imagesrcset/imagesizes MOETEN gelijk zijn aan die op de <picture>
         in App.tsx, anders kiest de preload een andere maat of een andere
         uitsnede dan de pagina en haalt de browser de foto twee keer op.
         Twee regels, want de hero is art-directed: staand (9:16, hele figuur)
         onder lg, portret (4:5, bovenlijf) daarboven. -->
    <link
      rel="preload"
      as="image"
      media="(min-width: 1024px)"
      href="/img/hero-portret.webp?v=20261020"
      imagesrcset="/img/hero-portret.webp?v=20261020 560w, /img/hero-portret-840.webp?v=20261020 840w, /img/hero-portret-1120.webp?v=20261020 1120w"
      imagesizes="min(45vw, 560px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(max-width: 1023.98px)"
      href="/img/hero-staand.webp?v=20261017"
      imagesrcset="/img/hero-staand.webp?v=20261017 720w, /img/hero-staand-1020.webp?v=20261017 1020w, /img/hero-staand-1320.webp?v=20261017 1320w, /img/hero-staand-1536.webp?v=20261017 1536w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Alles wat per pagina verschilt (title, description, canonical, og:,
         twitter:, robots, schema.org) staat tussen deze twee markeringen en
         wordt gezet door vite.config.ts. scripts/prerender.mjs vervangt het
         blok per pagina, zodat /aanpak/voeding zijn eigen titel en zijn eigen
         canonical draagt in de HTML zelf en niet pas nadat er javascript heeft
         gedraaid. Niet met de hand vullen: wat hier komt te staan wordt bij
         elke build overschreven. De bron is site.config.mjs. -->
    <!--kop:start--><!--kop:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
