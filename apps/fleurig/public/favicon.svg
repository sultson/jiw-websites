<!-- Hun eigen merkteken: het roze schijfje met het madeliefje, hetzelfde als in
     de balk bovenaan de site. Op 16 pixels zijn dunne omlijningen niet te
     lezen, dus daar staan de blaadjes vol wit in plaats van in lijn. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#c22a5f"/>
  <g fill="#ffffff">
    <ellipse cx="50" cy="30" rx="12.5" ry="17"/>
    <ellipse cx="50" cy="30" rx="12.5" ry="17" transform="rotate(72 50 50)"/>
    <ellipse cx="50" cy="30" rx="12.5" ry="17" transform="rotate(144 50 50)"/>
    <ellipse cx="50" cy="30" rx="12.5" ry="17" transform="rotate(216 50 50)"/>
    <ellipse cx="50" cy="30" rx="12.5" ry="17" transform="rotate(288 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="9" fill="#c22a5f"/>
</svg>
