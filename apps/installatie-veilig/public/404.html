<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina niet gevonden | Installatie Veilig</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b1014" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Alles in dit bestand staat op zichzelf: geen scripts, geen webfonts en
         geen gebundelde CSS, zodat deze pagina er ook staat als er van de rest
         van de build niets klopt. */
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: #0c0e0d;
        color: #ffffff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.6;
      }
      main { max-width: 30rem; text-align: center; }
      img { width: 15rem; max-width: 100%; height: auto; }
      h1 { margin: 1.75rem 0 0; font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0.75rem 0 0; color: rgb(255 255 255 / 0.6); }
      a.knop {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        background: #45d62f;
        color: #0c0e0d;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/img/logo-light.png" width="868" height="171" alt="Installatie Veilig Elektrotechniek" />
      <h1>Deze pagina bestaat niet</h1>
      <p>Mogelijk is het adres verouderd of staat er een typefout in de link.</p>
      <a class="knop" href="/">Naar de homepage</a>
    </main>
  </body>
</html>
