<style>
:root {
  --bg: #f3f5f1; --surface: #ffffff; --fg: #1d2a22; --muted: #5c6b61; --line: #d9dfd6;
  --accent: #2f6b45; --accent-soft: #e2eee5;
  --free: #2f6b45; --free-bg: #e2eee5;
  --likely: #6b5a1c; --likely-bg: #f3ecd2;
  --ask: #7a4a2a; --ask-bg: #f4e3d8;
  --paid: #8a2f3c; --paid-bg: #f6dfe2;
  --st-sent: #2b5a86; --st-sent-bg: #dde9f5;
  --st-reply: #2f6b45; --st-reply-bg: #d6ecdc;
  --st-quote: #7a4a2a; --st-quote-bg: #f4e3d8;
  --f-display: "Literata", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --surface: #19211c; --fg: #e3eae4; --muted: #9aa89f; --line: #2c3830;
  --accent: #7fc496; --accent-soft: #1f3327;
  --free: #8fd3a6; --free-bg: #1f3327; --likely: #e0c870; --likely-bg: #332c14; --ask: #f0a77c; --ask-bg: #3a2519;
  --paid: #f29aa6; --paid-bg: #3a1c21;
  --st-sent: #8fbfee; --st-sent-bg: #1a2b3b; --st-reply: #8fd3a6; --st-reply-bg: #1f3327; --st-quote: #f0a77c; --st-quote-bg: #3a2519;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121815; --surface: #19211c; --fg: #e3eae4; --muted: #9aa89f; --line: #2c3830;
  --accent: #7fc496; --accent-soft: #1f3327;
  --free: #8fd3a6; --free-bg: #1f3327; --likely: #e0c870; --likely-bg: #332c14; --ask: #f0a77c; --ask-bg: #3a2519;
  --paid: #f29aa6; --paid-bg: #3a1c21;
  --st-sent: #8fbfee; --st-sent-bg: #1a2b3b; --st-reply: #8fd3a6; --st-reply-bg: #1f3327; --st-quote: #f0a77c; --st-quote-bg: #3a2519;
  color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.lang button { font: 600 12.5px var(--f-mono); letter-spacing: .05em; border: 0; background: transparent; color: var(--muted); padding: 7px 14px; cursor: pointer }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--bg) }
.lang button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
header { display: grid; gap: 12px; margin-bottom: 28px }
h1 { font: 650 clamp(28px, 4.5vw, 42px)/1.1 var(--f-display); margin: 0; text-wrap: balance }
.lede { max-width: 66ch; color: var(--muted); margin: 0 }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 8px 0 36px }
.fact { background: var(--surface); padding: 16px 18px; display: grid; gap: 2px }
.fact b { font: 500 26px/1.1 var(--f-mono); font-variant-numeric: tabular-nums }
.fact span { color: var(--muted); font-size: 13px }
.fact.alert b { color: var(--ask) }

/* Status overview */
.status { margin-bottom: 40px }
.status h2 { font: 650 24px/1.2 var(--f-display); margin: 0 0 4px }
.status p.sub { margin: 0 0 16px; color: var(--muted); max-width: 70ch }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0 }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap }
.card .nm { font-weight: 600; word-break: break-word }
.card .nm a { color: var(--fg); text-underline-offset: 3px; text-decoration-color: var(--line) }
.card .meta { font: 500 12px var(--f-mono); color: var(--muted) }
.card p { margin: 0; font-size: 14px; color: var(--muted) }
.card p.next { color: var(--fg) }
.card p.next::before { content: "→ "; color: var(--accent); font-weight: 600 }
.st { display: inline-block; font: 600 12px var(--f-body); padding: 3px 9px; border-radius: 4px; white-space: nowrap }
.st.sent { color: var(--st-sent); background: var(--st-sent-bg) }
.st.reply { color: var(--st-reply); background: var(--st-reply-bg) }
.st.quote { color: var(--st-quote); background: var(--st-quote-bg) }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center }
.filters .lbl { font: 500 12px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px }
.chip { font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 6px 12px; border-radius: 999px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg) }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin: 6px 0 28px }

section.group { margin-bottom: 36px }
section.group h2 { font: 650 21px/1.2 var(--f-display); margin: 0 0 4px }
section.group p.sub { margin: 0 0 12px; color: var(--muted); font-size: 14px; max-width: 70ch }
.tbl { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface) }
table { width: 100%; border-collapse: collapse }
th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
  padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg) }
td { padding: 13px 14px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px }
tr:last-child td { border-bottom: 0 }
td.n { font: 500 13px var(--f-mono); color: var(--muted); width: 36px; font-variant-numeric: tabular-nums }
td.site { width: 26% }
td.site a { color: var(--fg); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 3px; word-break: break-word }
td.site a:hover { color: var(--accent); text-decoration-color: var(--accent) }
td.site .kind { display: block; color: var(--muted); font-size: 13px; margin-top: 2px }
td.site .st { margin-top: 6px }
td.ev { width: 24% }
.comp { display: inline-flex; gap: 6px; align-items: center; font: 500 12px var(--f-mono); color: var(--accent);
  background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; margin-bottom: 4px }
.badge { display: inline-block; font: 600 12px var(--f-body); padding: 3px 9px; border-radius: 4px; white-space: nowrap }
.badge.free { color: var(--free); background: var(--free-bg) }
.badge.likely { color: var(--likely); background: var(--likely-bg) }
.badge.ask { color: var(--ask); background: var(--ask-bg) }
.badge.paid { color: var(--paid); background: var(--paid-bg) }
td.cost { width: 130px }
tr.top td.n { color: var(--accent); font-weight: 600 }
tr.top { box-shadow: inset 3px 0 0 var(--accent) }
tr.done td { background: color-mix(in srgb, var(--accent-soft) 35%, transparent) }
.empty { padding: 18px; color: var(--muted) }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 12px }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0 }
.note h3 { font: 650 17px var(--f-display); margin: 0 0 10px }
.note ol, .note ul { margin: 0; padding-left: 20px; display: grid; gap: 8px }
.note li { font-size: 14px }
footer { margin-top: 36px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px }

@media (max-width: 760px) {
  table, tbody, tr, td { display: block; width: 100% !important }
  thead { display: none }
  tr { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 4px 10px }
  tr:last-child { border-bottom: 0 }
  td { border: 0; padding: 0; min-width: 0 }
  td.n { grid-row: 1; width: auto !important }
  td.site, td.ev, td.how, td.cost { grid-column: 2 }
  td[data-l]::before { content: attr(data-l); display: block; font: 500 10.5px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 6px }
}
@media (prefers-reduced-motion: no-preference) { .chip, .lang button { transition: background .15s, color .15s } }
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rowsAll = G.flatMap(g => g.rows);
const state = { lang: "nl", filter: "all" };
try {
  const h = location.hash.slice(1), saved = localStorage.getItem("bl-lang");
  state.lang = (h === "nl" || h === "en") ? h : (saved === "nl" || saved === "en") ? saved : ((navigator.language || "").startsWith("en") ? "en" : "nl");
} catch (e) {}

function statusCards(t, L) {
  const order = { reply: 0, quote: 1, sent: 2 };
  return Object.entries(S).sort((a, b) => order[a[1].st] - order[b[1].st] || a[0] - b[0]).map(([n, s]) => {
    const r = rowsAll.find(r => r[0] === +n);
    return `<div class="card">
      <div class="top"><span class="nm">#${n} <a href="${r[2]}" target="_blank" rel="noopener">${esc(r[1])}</a></span><span class="st ${s.st}">${t.stLabel[s.st]}</span></div>
      <span class="meta">${esc(s.date)}</span>
      <p>${esc(s.note[L])}</p>
      <p class="next">${esc(s.next[L])}</p>
    </div>`;
  }).join("");
}

function groups(t, L) {
  return G.map(g => {
    const rows = g.rows.filter(r => state.filter === "all" || r[7] === state.filter);
    const body = rows.length ? `<table><thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
      rows.map(([n, site, url, kind, cnt, ev, how, cost, top]) => {
        const s = S[n];
        return `<tr class="${top ? "top" : ""}${s ? " done" : ""}">
        <td class="n">${n}</td>
        <td class="site"><a href="${url}" target="_blank" rel="noopener">${esc(site)}</a><span class="kind">${esc(kind[L])}</span>${s ? `<span class="st ${s.st}">${t.stLabel[s.st]}</span>` : ""}</td>
        <td class="ev" data-l="${t.th[2]}"><span class="comp">${esc(cnt[L])}</span><div>${esc(ev[L])}</div></td>
        <td class="how" data-l="${t.th[3]}">${esc(how[L])}</td>
        <td class="cost" data-l="${t.th[4]}"><span class="badge ${cost}">${t.cost[cost]}${n === 4 ? " · €99" : ""}</span></td></tr>`;
      }).join("") + `</tbody></table>`
      : `<div class="empty">${t.empty}</div>`;
    return `<section class="group"><h2>${g.t[L]}</h2><p class="sub">${esc(g.s[L])}</p><div class="tbl">${body}</div></section>`;
  }).join("");
}

function render() {
  const L = state.lang, t = T[L];
  document.documentElement.lang = L;
  const chip = (f, label) => `<button class="chip" id="f-${f}" data-f="${f}" aria-pressed="${state.filter === f}">${label}</button>`;
  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="eyebrow">${t.eyebrow}</div>
      <div class="lang" role="group" aria-label="Taal / Language">
        <button id="l-nl" data-l="nl" aria-pressed="${L === "nl"}">NL</button>
        <button id="l-en" data-l="en" aria-pressed="${L === "en"}">EN</button>
      </div>
    </div>
    <header><h1>${t.h1}</h1><p class="lede">${t.lede}</p></header>
    <div class="facts">${t.facts.map(([b, s, a]) => `<div class="fact${a ? " alert" : ""}"><b>${b}</b><span>${s}</span></div>`).join("")}</div>
    <section class="status"><h2>${t.stT}</h2><p class="sub">${t.stSub}</p><div class="cards">${statusCards(t, L)}</div></section>
    <div class="filters" role="group" aria-label="${t.show}">
      <span class="lbl">${t.show}</span>
      ${chip("all", t.fAll)}${chip("free", t.fFree)}${chip("likely", t.fLikely)}${chip("ask", t.fAsk)}${chip("paid", t.fPaid)}
    </div>
    <div class="legend">
      <span><span class="badge free">${t.cost.free}</span> ${t.legend.free}</span>
      <span><span class="badge likely">${t.cost.likely}</span> ${t.legend.likely}</span>
      <span><span class="badge ask">${t.cost.ask}</span> ${t.legend.ask}</span>
      <span><span class="badge paid">${t.cost.paid}</span> ${t.legend.paid}</span>
    </div>
    ${groups(t, L)}
    <div class="cols">
      <div class="note"><h3>${t.howT}</h3><ol>${t.how.map(x => `<li>${x}</li>`).join("")}</ol></div>
      <div class="note"><h3>${t.outT}</h3><ul>${t.out.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
    <footer>${esc(t.foot)}</footer>`;
}

document.getElementById("app").addEventListener("click", e => {
  const c = e.target.closest(".chip"), l = e.target.closest(".lang button");
  if (c) { state.filter = c.dataset.f; render(); document.getElementById("f-" + state.filter).focus(); }
  if (l) { state.lang = l.dataset.l; try { localStorage.setItem("bl-lang", state.lang) } catch (e) {} render(); document.getElementById("l-" + state.lang).focus(); }
});
render();
</script>
